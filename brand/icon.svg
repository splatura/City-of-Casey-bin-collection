<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4CAF50"/>
      <stop offset="1" stop-color="#2E7D32"/>
    </linearGradient>
  </defs>

  <!-- rounded-square tile (fills the canvas: keeps the icon square + trimmed) -->
  <rect x="0" y="0" width="256" height="256" rx="56" fill="url(#tile)"/>

  <!-- soft ground shadow -->
  <ellipse cx="128" cy="220" rx="60" ry="10" fill="#1B5E20" opacity="0.35"/>

  <!-- wheels, clearly peeking out below the body -->
  <circle cx="102" cy="206" r="13" fill="#1B5E20"/>
  <circle cx="154" cy="206" r="13" fill="#1B5E20"/>

  <!-- single hinge bump at the back of the lid -->
  <rect x="113" y="56" width="30" height="16" rx="8" fill="#ffffff"/>

  <!-- lid (flat plate, slight overhang) -->
  <rect x="72" y="68" width="112" height="22" rx="11" fill="#ffffff"/>

  <!-- body: tall and boxy with a gentle taper and rounded base -->
  <path d="M86 96 H170 L160 196 Q158 205 149 205 H107 Q98 205 96 196 Z" fill="#ffffff"/>

  <!-- vertical ridges -->
  <g stroke="#2E7D32" stroke-width="7" stroke-linecap="round" opacity="0.20">
    <line x1="112" y1="108" x2="110" y2="190"/>
    <line x1="128" y1="108" x2="128" y2="190"/>
    <line x1="144" y1="108" x2="146" y2="190"/>
  </g>
</svg>
